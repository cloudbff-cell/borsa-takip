name: Puan ölçümü (analiz)

# Tek seferlik analiz. İşlem yapmaz, secret kullanmaz, paneli değiştirmez.
on:
  push:
    branches: [main]
    paths: ["tools/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  olcum:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/entry_test.py
