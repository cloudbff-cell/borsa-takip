name: Hisse tarama

on:
  schedule:
    # Saatler UTC. Hafta içi 20 dakikada bir tetiklenir; betik New York saatine bakarak
    # açılış öncesi / seans içi / kapanış sonrası modunu kendisi seçer. GitHub zamanlanmış
    # tetiklemeleri bazen geciktirir ya da atlar; sık tetikleme bunu telafi eder. Aynı
    # sinyal/emir tekrar gönderilmez (cache/state.json).
    - cron: "6,26,46 11-22 * * 1-5"
  # Kod güncellenince paneli hemen yeniden oluştur (bildirim ve emir yok)
  push:
    branches: [main]
    paths: ["engine/**", "site/**", ".github/workflows/**", "requirements.txt", "komutlar/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Mod: auto (saate göre seçer), pre, intraday, post"
        default: "auto"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 1) Tarama + Telegram + Alpaca. Ortam (environment) koruması YOK: panel yayını takılsa bile
  #    tarama ve emirler engellenmez.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: tarama-scan
      cancel-in-progress: false
    outputs:
      site: ${{ steps.chk.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Önbelleği geri yükle (temel veriler, gönderilen sinyaller)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: tarama-${{ github.run_id }}
          restore-keys: tarama-

      - name: Taramayı çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # Botu açıp kapatmak için: Settings > Secrets and variables > Actions > Variables
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED }}
          ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m engine.run --mode post --force --no-telegram --ping
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.mode }}" ] && [ "${{ inputs.mode }}" != "auto" ]; then
            # Elle seçilen mod: saatten bağımsız çalıştır
            python -m engine.run --mode "${{ inputs.mode }}" --force
          else
            python -m engine.run --mode auto
          fi

      - name: Önbelleği kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: tarama-${{ github.run_id }}

      - name: Panel var mı?
        id: chk
        run: test -f site/data/summary.json && echo "ok=1" >> "$GITHUB_OUTPUT" || echo "ok=0" >> "$GITHUB_OUTPUT"

      - if: steps.chk.outputs.ok == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # 2) Paneli yayınla. Ayrı iş: bir yayın takılırsa sonraki gelen onu iptal edip yerine geçer.
  deploy:
    needs: scan
    if: needs.scan.outputs.site == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tarama-pages
      cancel-in-progress: true
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
