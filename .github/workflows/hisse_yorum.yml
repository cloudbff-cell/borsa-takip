name: Hisse yorum (analiz)

# Verilen hisseleri orta ve kısa vade kurallarına göre değerlendirir. İşlem yapmaz.
on:
  workflow_dispatch:
    inputs:
      semboller:
        description: "Semboller (boşlukla)"
        default: "PLTR"

permissions:
  contents: read

jobs:
  yorum:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u tools/hisse_yorum.py ${{ inputs.semboller }}
