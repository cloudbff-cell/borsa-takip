name: Gün aşırı alım kuralı araştırması (analiz)

# Kısa vadeli (1-10 gün) alım kurallarını 10 yıllık veriyle karşılaştırır.
# İşlem yapmaz, Alpaca anahtarı yalnız geçmiş 5 dk veriyi okumak için.
on:
  push:
    branches: [main]
    paths: ["tools/giris_arastirma.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: tarama-giris-${{ github.run_id }}
          restore-keys: tarama-
      - name: Test
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u tools/giris_arastirma.py
