name: Gün aşırı yüzde çıkış testi (analiz)

# Botun giriş kurallarıyla 10 yıllık testte stop -%2 / kâr al +%1 gibi sabit yüzde çıkışları karşılaştırır.
# İşlem yapmaz, Alpaca anahtarı yalnız geçmiş 5 dk veriyi okumak için.
on:
  push:
    branches: [main]
    paths: ["tools/yuzde_cikis_test.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: tarama-gunasiri-${{ github.run_id }}
          restore-keys: tarama-
      - name: Test
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u tools/yuzde_cikis_test.py
