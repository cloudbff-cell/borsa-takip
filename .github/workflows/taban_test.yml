name: Yatay taban geri testi (analiz)

# Düşüş sonrası yatay taban alımını 10 yıllık günlük veriyle test eder.
on:
  push:
    branches: [main]
    paths: ["tools/taban_test.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: tarama-taban-${{ github.run_id }}
          restore-keys: tarama-
      - name: Test
        run: python -u tools/taban_test.py
