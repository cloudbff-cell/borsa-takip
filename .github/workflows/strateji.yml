name: Strateji araştırması (analiz)

# Günlük işlem stratejilerini ~12 aylık 5 dk veriyle karşılaştırır. İşlem yapmaz.
# Alpaca anahtarları yalnız geçmiş fiyat verisini okumak için kullanılır.
on:
  push:
    branches: [main]
    paths: ["tools/strateji_arastirma.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arastirma:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: tarama-arastirma-${{ github.run_id }}
          restore-keys: tarama-
      - name: Araştırma
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u tools/strateji_arastirma.py
