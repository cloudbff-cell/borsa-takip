name: Emir teşhisi (analiz)

# Eldeki hisselerin emir geçmişini yazdırır. İşlem yapmaz.
on:
  push:
    branches: [main]
    paths: ["tools/emir_teshis.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teshis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
        run: python tools/emir_teshis.py
